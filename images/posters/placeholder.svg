<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#f59e0b" stroke-width="2" rx="8" opacity="0.35"/>
  <g filter="url(#glow)">
    <circle cx="200" cy="200" r="70" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.8"/>
    <path d="M165 175 L200 140 L235 175 Z" fill="#f59e0b" opacity="0.9"/>
    <rect x="170" y="190" width="60" height="20" fill="#f59e0b" rx="2"/>
  </g>
  <text x="200" y="420" font-family="sans-serif" font-size="20" font-weight="700" fill="#e5e7eb" text-anchor="middle">Sin póster</text>
  <text x="200" y="450" font-family="sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">disponible en el catálogo</text>
  <text x="200" y="540" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">MovieSearch • Catálogo local</text>
  <line x1="150" y1="490" x2="250" y2="490" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
</svg>
